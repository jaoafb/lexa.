name: Conferir diariamente as 13 legislações

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pilot-official-sources.yml'
      - 'scripts/collection_transport.py'
      - 'scripts/daily_collection.py'
      - 'scripts/pilot_official_sources.py'
      - 'scripts/camara_comparison.py'
      - 'scripts/camara_sources.py'
      - 'scripts/official_http.py'
      - 'scripts/official_html.py'
      - 'scripts/check_official_sources.py'
      - 'scripts/import_official.py'
      - 'monitor/sources.json'
      - 'tests/python/test_daily_collection.py'
      - 'tests/python/test_monitor.py'
      - 'tests/python/test_pilot_official_sources.py'
  schedule:
    - cron: '40 9 * * *' # 06:40 em Brasília (UTC-3); o início agendado pelo GitHub é aproximado.
  workflow_dispatch:
    inputs:
      provider:
        description: Fonte a consultar
        type: choice
        default: daily
        options: [daily, camara, planalto, classico, novo]

permissions:
  contents: read

concurrency:
  group: lexa-daily-collection
  cancel-in-progress: false

jobs:
  compare:
    name: Consultar fonte oficial
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROBE_PROVIDER: ${{ inputs.provider || 'daily' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar e comparar os textos da fonte
        run: |
          if [ "$PROBE_PROVIDER" = daily ]; then
            python scripts/daily_collection.py --output "monitor/run/daily/${{ github.run_id }}-${{ github.run_attempt }}" --summary "$GITHUB_STEP_SUMMARY"
          else
            python scripts/pilot_official_sources.py --provider "$PROBE_PROVIDER" --output "monitor/run/pilot-v2/$PROBE_PROVIDER.json" --summary "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar relatório e diferenças para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conferencia-legislacao-${{ env.PROBE_PROVIDER }}-${{ github.run_id }}
          path: |
            monitor/run/daily/
            monitor/run/pilot-v2/
          if-no-files-found: error
          retention-days: 30
